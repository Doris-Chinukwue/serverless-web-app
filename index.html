<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5
        }

        h1 {
            color: #1F4E79;

        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #1F4E70;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #2E75B6;
        }

        #message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: #E2EFDA;
            color: #375623;
        }

        .error {
            background-color: #FCE4D6;
            color: #C55A11;
        }
    </style>
</head>
<body>

    <h1>Contact Us</h1>
    <p>Fill in the form below and we will get back to you.</p>

    <input type="text" id="name" placeholder="Your name" />
    <textarea id="message-input" rows="5"
    placeholder="Your message"></textarea>
    <button onclick="submitForm()">Submit</button>

    <div id="message"></div>

    <script>
        async function submitForm() {
            const name = document.getElementById('name').value;
            const message =
            document.getElementById('message-input').value;

            if (!name || !message) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }

            try {
                const response = await fetch('https://1m24kzwpch.execute-api.eu-north-1.amazonaws.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, message })
                });

                if (response.ok) {
                    showMessage('Form submitted successfully!', 'success');
                    document.getElementById('name').value = '';
                    document.getElementById('message-input').value = '';
                } else { 
                    showMessage('Something went wrong. Please try again.', 'error');
                }

            } catch (error) {
                showMessage('Could not connect. Please try again.', 'error')
            }
        }

        function showMessage(text, type) {
            const div = document.getElementById('message');
            div.textContent = text;
            div.className = type;
            div.style.display = 'block';
        }
    </script>

</body>
</html>
